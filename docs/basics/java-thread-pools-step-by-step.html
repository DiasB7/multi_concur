 P(`<b>Goal:</b> a queue, N threads, each looping: take a task, run it. <code>submit</code> adds to the queue. <code>shutdown</code> sets a flag the loop checks.`),
 P(`<b>Test:</b> submit 1000 tasks that print the thread name.`),
 Q(`Hint`, `<p>Build threads in the constructor, but start them in a separate <code>start()</code> method. The loop condition reads the shutdown flag.</p>`),
 R(`Make it work first. Make it right in the next versions.`)),
S("Build v2: is your queue safe?",
 P(`<b>Question:</b> one thread calls <code>submit</code> while N workers take tasks at the same time. Is your queue OK with that?`),
 P(`<b>Test:</b> submit 200,000 tasks that increment an <code>AtomicInteger</code>. After shutdown, compare submitted vs executed.`),
 Q(`Hint`, `<p>If executed &lt; submitted (or you get odd exceptions), look at Tool 3.</p>`),
 R(`Test with big numbers: races hide at small ones.`)),
S("Build v3: what do idle workers do?",
 P(`<b>Question:</b> the queue is empty. What are your workers doing? Open a CPU monitor and look.`),
 Q(`Hint`, `<p>A loop that keeps asking "anything? anything?" burns a core per worker (busy-spin). Look at Tool 2: which remove method waits instead? And which one waits but still lets you re-check the shutdown flag?</p>`),
 R(`Idle workers should sleep, not spin.`)),
S("Build v4: does shutdown really finish?",
 Y(`The lecturer asked the group: "I have 10 workers, I submit tasks, then I say shutdown(). Is it guaranteed the pool closes?" A student pointed at task.run(): "it can just run and run."`),
 Y(`"Inside a submitted Runnable someone can write while (true) {} and your shutdown flag is irrelevant. If you write a crooked Runnable, nothing can be done about it. Period."`),
 P(`<b>Questions:</b>`),
 P(`<ul><li>After <code>shutdown()</code>, do already-queued tasks still run?</li><li>What if a task never ends?</li><li>How does a caller wait until the pool is done?</li></ul>`),
 P(`Add <code>shutdownNow()</code> (returns tasks that never ran) and <code>awaitTermination(timeout)</code>.`),
 Q(`Hint`, `<p>Keep references to your worker threads so you can interrupt and join them. Test with the polite and rude tasks from Tool 5. Also: what should a worker do when its waiting call throws InterruptedException but the pool is NOT shut down?</p>`),
 R(`Graceful stop, forced stop, wait — three different things.`)),
S("Build v5: a task throws",
 P(`<b>Test:</b> 4 workers. Submit 4 tasks that throw, then 10 normal tasks.`),
 P(`<b>Question:</b> do the 10 normal tasks run?`),
 Q(`Hint`, `<p>Tool 6. Log the failure, count it, keep looping.</p>`),
 R(`After v5, a bad task costs nothing but a log line.`)),
S("Build v6: flood protection",
 P(`<b>Test:</b> submit 1,000,000 slow tasks as fast as you can.`),
 P(`<b>Questions:</b> how much memory does it use? Should your pool say "no"? How do you know the queue is full without waiting?`),
 P(`In the lecture, students suggested a dead-letter queue and Kafka. The lecturer wanted the simplest answer:`),
 Y(`"We just throw it away and say: we are full."`),
 P(`He called it the <b>abort policy</b>: the start of backpressure. Then add a policy choice: the four from chapter 8.`),
 Q(`Hint`, `<p>A bounded queue + the insert method from Tool 2 that returns false instead of throwing or waiting. Then a switch on the policy.</p>`),
 R(`Your pool now has backpressure.`)),
S("Build v7: who starts the threads?",
 P(`<b>Question:</b> do you start threads inside the constructor?`),
 Q(`Hint`, `<p>Starting threads (that use <code>this</code>) in a constructor lets them see a half-built object, and takes away the caller's control over when threads appear. Keep a separate <code>start()</code>.</p>`),
 R(`Constructors build. start() starts.`)),
S("How to test your pool",
 P(`<ul><li>Counter test: submitted == executed (with big numbers).</li>
 <li>CPU test: idle pool ≈ 0 % CPU.</li>
 <li>Crash test: throwing tasks don't reduce the worker count.</li>
 <li>Stop test: polite infinite task stops on <code>shutdownNow</code>, not on <code>shutdown</code>.</li>
 <li>Flood test: rejections happen, memory stays flat.</li>
 <li>Fairness look: print thread names — is work spread evenly? (It won't be perfectly. Why?) The lecturer called this checking for <b>starvation</b>; the basics page (chapter 4, ★ step) shows a real pool where one worker did 997 of 1000 tasks.</li></ul>`),
 R(`Each test matches one version.`)),
S("Then compare with the JDK",
 P(`After your pool works, list what <code>ThreadPoolExecutor</code> still does that yours doesn't:`),
 P(`<ul><li><code>Future</code> / <code>Callable</code>: results, exceptions, cancel</li><li>growing core → max, keep-alive</li><li>replacing dead workers</li><li><code>beforeExecute</code> / <code>afterExecute</code> hooks, <code>ThreadFactory</code></li><li>metrics</li><li>documented memory-model guarantees</li></ul>`),
 R(`Building one yourself = you'll never misconfigure the real one.`))
]}
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KW=new Set('abstract boolean break case catch class continue default do else extends final finally for if implements import instanceof int long new null private protected public return static super switch this throw throws true false try var void while'.split(' '));
function hlJava(line){
  // split off // comment (not inside a string)
  let inS=false, cut=-1;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='\\'&&inS){i++;continue}
    if(ch==='"'){inS=!inS;continue}
    if(!inS&&ch==='/'&&line[i+1]==='/'){cut=i;break}}
  const codePart=cut<0?line:line.slice(0,cut), com=cut<0?'':line.slice(cut);
  const re=/("(?:[^"\\]|\\.)*")|(@\w+)|\b(\d[\d_]*L?)\b|\b([A-Za-z_]\w*)\b/g;
  let out='',last=0,m;
  while((m=re.exec(codePart))){
    out+=esc(codePart.slice(last,m.index));
    if(m[1])out+='<span class="ts">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tk">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tn">'+m[3]+'</span>';
    else{const w=m[4]; if(KW.has(w))out+='<span class="tk">'+w+'</span>'; else if(/^[A-Z]/.test(w)&&!/^[A-Z_]+$/.test(w))out+='<span class="tt">'+w+'</span>'; else out+=w;}
    last=re.lastIndex;
  }
  out+=esc(codePart.slice(last));
  if(com)out+='<span class="tc">'+esc(com)+'</span>';
  return out;
}
function hl(src,lang){
  if(lang==='java')return src.split('\n').map(hlJava).join('\n');
  if(lang==='bash')return src.split('\n').map(l=>{const i=l.indexOf('  #');return i<0?esc(l):esc(l.slice(0,i))+'<span class="tc">'+esc(l.slice(i))+'</span>'}).join('\n');
  return esc(src);
}
function block(b){
  switch(b[0]){
    case 'p':return b[1].trim().startsWith('<')&&!b[1].trim().startsWith('<b')&&!b[1].trim().startsWith('<code')&&!b[1].trim().startsWith('<kbd')&&!b[1].trim().startsWith('<span')?b[1]:'<p>'+b[1]+'</p>';
    case 'code':return '<div class="codebox"><pre><code>'+hl(b[1],b[2])+'</code></pre></div>';
    case 'out':return '<div class="out"><div class="lbl">Output</div><pre><code>'+esc(b[1])+'</code></pre></div>';
    case 'rem':return '<p class="rem"><span>Remember</span>'+b[1]+'</p>';
    case 'quote':return '<p class="quote">'+b[1]+'</p>';
    case 'q':return '<details class="q'+(b[1]==='Hint'?' hint':'')+'"><summary>'+b[1]+'</summary><div class="a">'+b[2]+'</div></details>';
    case 'w':return '<div data-w="'+b[1]+'"></div>';
  }
  return '';
}

/* ---------- state ---------- */
const flat=[]; CH.forEach((c,ci)=>c.steps.forEach((s,si)=>flat.push({ci,si})));
function load(k,d){try{const v=localStorage.getItem('tp.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem('tp.'+k,JSON.stringify(v))}catch(e){}}
let idx=Math.min(Math.max(0,load('idx',0)|0),flat.length-1);
let seen=new Set(load('seen',[]));
let mode=load('mode','step')==='chapter'?'chapter':'step';

function stepCard(ci,si,withFocus){
  const s=CH[ci].steps[si];
  return '<article class="step"><h2'+(withFocus?' tabindex="-1" id="focus"':'')+'><span class="snum">'+(si+1)+'.</span>'+s.t+'</h2>'+s.x.map(block).join('')+'</article>';
}
function render(focus){
  const {ci,si}=flat[idx];
  const ch=CH[ci];
  seen.add(idx); save('seen',[...seen]); save('idx',idx);
  $('#chname').textContent='Chapter '+ci+': '+ch.t;
  if(mode==='step'){
    $('#main').innerHTML=stepCard(ci,si,true);
    $('#pos').textContent='Step '+(si+1)+' of '+ch.steps.length+' in this chapter';
    $('#modebtn').textContent='Show whole chapter';
    $('#back').disabled=idx===0;
    $('#next').disabled=idx===flat.length-1;
    $('#next').textContent=idx===flat.length-1?'Finished':(si===ch.steps.length-1?'Next chapter':'Next');
  }else{
    $('#main').innerHTML=ch.steps.map((_,k)=>stepCard(ci,k,k===0)).join('');
    ch.steps.forEach((_,k)=>seen.add(flat.findIndex(f=>f.ci===ci&&f.si===k))); save('seen',[...seen]);
    $('#pos').textContent=ch.steps.length+' steps';
    $('#modebtn').textContent='One step at a time';
    $('#back').disabled=ci===0;
    $('#next').disabled=ci===CH.length-1;
    $('#next').textContent='Next chapter';
  }
  $('#bar').style.width=((idx+1)/flat.length*100)+'%';
  document.querySelectorAll('[data-w]').forEach(el=>{if(el.dataset.w==='sim')initSim(el);if(el.dataset.w==='reject')initReject(el)});
  buildMap();
  if(focus){window.scrollTo(0,0);const f=$('#focus');if(f)f.focus({preventScroll:true});}
}
function go(d){
  if(mode==='step'){idx=Math.min(Math.max(0,idx+d),flat.length-1);}
  else{const ci=Math.min(Math.max(0,flat[idx].ci+d),CH.length-1);idx=flat.findIndex(f=>f.ci===ci);}
  render(true);
}
$('#next').onclick=()=>go(1); $('#back').onclick=()=>go(-1);
$('#modebtn').onclick=()=>{mode=mode==='step'?'chapter':'step';save('mode',mode);if(mode==='chapter'){idx=flat.findIndex(f=>f.ci===flat[idx].ci);}render(true)};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeMap();
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'||e.altKey||e.ctrlKey||e.metaKey)return;
  if(document.body.classList.contains('open'))return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
});

/* ---------- map ---------- */
function buildMap(){
  const cur=flat[idx];
  let h='';let k=0;
  CH.forEach((c,ci)=>{
    const done=c.steps.every((_,si)=>seen.has(flat.findIndex(f=>f.ci===ci&&f.si===si)));
    h+='<details'+(ci===cur.ci?' open':'')+'><summary>'+ci+'. '+c.t+(done?' ✓':'')+'</summary><ol>';
    c.steps.forEach((s,si)=>{const g=k++;
      h+='<li><button data-go="'+g+'" class="'+(ci===cur.ci&&(mode==='chapter'||si===cur.si)?'cur':'')+'"><span class="ck">'+(seen.has(g)?'✓':'')+'</span><span>'+(si+1)+'. '+s.t+'</span></button></li>';});
    h+='</ol></details>';
  });
  $('#maplist').innerHTML=h;
}
$('#maplist').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;idx=+b.dataset.go;if(mode==='chapter')mode='step',save('mode',mode);closeMap();render(true)});
function openMap(){document.body.classList.add('open');$('#mapbtn').setAttribute('aria-expanded','true');$('#closemap').focus()}
function closeMap(){if(!document.body.classList.contains('open'))return;document.body.classList.remove('open');$('#mapbtn').setAttribute('aria-expanded','false');$('#mapbtn').focus()}
$('#mapbtn').onclick=openMap; $('#closemap').onclick=closeMap; $('#scrim').onclick=closeMap;
$('#reset').onclick=()=>{seen=new Set();idx=0;save('seen',[]);save('idx',0);closeMap();render(true)};
// the drawer lives outside body class target: move shell children under body for .open selector
document.querySelectorAll('#shell > *').forEach(n=>document.body.appendChild(n));

/* ---------- simulator ---------- */
function initSim(el){
  el.innerHTML=`<div class="sim">
   <div class="pre" role="group" aria-label="Presets">
    <button data-p="2,2,abq,3,10">2 / 2 / queue 3, 10 tasks</button>
    <button data-p="2,4,abq,2,6">2 / 4 / queue 2, 6 tasks</button>
    <button data-p="2,100,lbq,0,50">2 / 100 / unbounded, 50 tasks</button>
    <button data-p="0,inf,sq,0,20">cached: 0 / ∞ / SynchronousQueue</button>
    <button data-p="4,4,lbq,0,20">fixed(4)</button>
    <button data-p="0,10,lbq,0,5">core 0 / 10 / unbounded</button>
   </div>
   <div class="ctl">
    <label>corePoolSize<input type="number" min="0" max="50" data-k="core" value="2"></label>
    <label>maximumPoolSize<input type="number" min="1" max="200" data-k="max" value="4"></label>
    <label class="chk"><input type="checkbox" data-k="inf"> max = Integer.MAX_VALUE</label>
    <label>Queue<select data-k="qt"><option value="abq">ArrayBlockingQueue(n)</option><option value="lbq">LinkedBlockingQueue() unbounded</option><option value="sq">SynchronousQueue (capacity 0)</option></select></label>
    <label>Queue capacity n<input type="number" min="1" max="500" data-k="cap" value="2"></label>
    <label>Tasks for "Submit all"<input type="number" min="1" max="500" data-k="n" value="6"></label>
   </div>
   <div class="code-line" data-o="code"></div>
   <div class="act"><button class="main" data-a="one">Submit 1 task</button><button data-a="all">Submit all</button><button data-a="reset">Reset</button></div>
   <div data-o="err" class="simerr" role="alert"></div>
   <div class="lane"><div class="lh" style="color:var(--thread)">Threads (running tasks)</div><div class="chips" data-o="th"></div></div>
   <div class="lane"><div class="lh" style="color:var(--queue)">Queue (waiting tasks)</div><div class="chips" data-o="qu"></div></div>
   <div class="lane"><div class="lh" style="color:var(--reject)">Rejected</div><div class="chips" data-o="rj"></div></div>
   <div class="simlog" data-o="log" aria-live="polite"></div>
  </div>`;
  const q=s=>el.querySelector(s), inp=k=>q('[data-k="'+k+'"]');
  let st;
  function cfg(){
    const core=Math.max(0,+inp('core').value|0), inf=inp('inf').checked, max=inf?Infinity:Math.max(0,+inp('max').value|0), qt=inp('qt').value, cap=qt==='abq'?Math.max(1,+inp('cap').value|0):(qt==='lbq'?Infinity:0), n=Math.max(1,Math.min(500,+inp('n').value|0));
    inp('max').disabled=inf; inp('cap').disabled=qt!=='abq';
    return {core,max,qt,cap,n,inf};
  }
  function reset(){
    const c=cfg();
    st={c,threads:[],queue:[],rej:[],k:0,log:[]};
    const qs=c.qt==='abq'?'new ArrayBlockingQueue<>('+c.cap+')':c.qt==='lbq'?'new LinkedBlockingQueue<>()':'new SynchronousQueue<>()';
    q('[data-o=code]').textContent='new ThreadPoolExecutor('+c.core+', '+(c.inf?'Integer.MAX_VALUE':c.max)+', 60, SECONDS, '+qs+')';
    let err='';
    if(!c.inf&&c.max<=0)err='maximumPoolSize must be > 0. The real constructor throws IllegalArgumentException.';
    else if(!c.inf&&c.max<c.core)err='maximumPoolSize < corePoolSize. The real constructor throws IllegalArgumentException.';
    q('[data-o=err]').textContent=err; st.bad=!!err;
    q('[data-a=one]').disabled=st.bad; q('[data-a=all]').disabled=st.bad;
    draw();
  }
  function add(){
    const c=st.c, id=++st.k, T=st.threads.length, mx=c.inf?'MAX':c.max;
    if(T<c.core){st.threads.push(id);st.log.push('task '+id+': threads '+T+' < core '+c.core+' → new thread T'+(T+1));}
    else if(st.queue.length<c.cap){st.queue.push(id);let msg='task '+id+': threads '+T+' ≥ core '+c.core+' → queue.offer() ok'+(c.cap===Infinity?'':' ('+st.queue.length+'/'+c.cap+')');
      if(T===0){const h=st.queue.shift();st.threads.push(h);msg+=' — but 0 threads exist, so the pool starts T1; it takes task '+h+' from the queue';}
      st.log.push(msg);}
    else if(T<c.max){st.threads.push(id);st.log.push('task '+id+': '+(c.cap===0?'SynchronousQueue: nobody waiting':'queue full')+', threads '+T+' < max '+mx+' → new thread T'+(T+1));}
    else{st.rej.push(id);st.log.push('task '+id+': queue full, threads '+T+' = max → REJECTED');}
  }
  function chips(arr,cls,label,limit){
    if(!arr.length)return '<span class="chip empty">empty</span>';
    const shown=arr.slice(0,limit).map((id,i)=>'<span class="chip '+cls+'">'+label(id,i)+'</span>').join('');
    return shown+(arr.length>limit?'<span class="more">+'+(arr.length-limit)+' more</span>':'');
  }
  function draw(){
    const c=st.c;
    q('[data-o=th]').innerHTML=chips(st.threads,'th',(id,i)=>'T'+(i+1)+': task '+id,40)+'<span class="more">&nbsp;'+st.threads.length+' thread'+(st.threads.length===1?'':'s')+'</span>';
    q('[data-o=qu]').innerHTML=chips(st.queue,'qu',id=>'task '+id,40)+'<span class="more">&nbsp;'+st.queue.length+' / '+(c.cap===Infinity?'≈2 billion':c.cap)+'</span>';
    q('[data-o=rj]').innerHTML=chips(st.rej,'rj',id=>'task '+id,40)+'<span class="more">&nbsp;'+st.rej.length+'</span>';
    const lg=q('[data-o=log]');
    lg.innerHTML=st.log.length?st.log.map(l=>'<div>'+esc(l)+'</div>').join(''):'<div>No tasks yet. Press "Submit 1 task".</div>';
    lg.scrollTop=lg.scrollHeight;
  }
  el.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('change',()=>{el.querySelectorAll('.pre button').forEach(b=>b.classList.remove('on'));reset()}));
  q('[data-a=one]').onclick=()=>{if(st.bad)return;add();draw()};
  q('[data-a=all]').onclick=()=>{if(st.bad)return;const r=st.c.n-st.k;for(let i=0;i<Math.max(r,0);i++)add();if(r<=0){for(let i=0;i<st.c.n;i++)add()}draw()};
  q('[data-a=reset]').onclick=reset;
  el.querySelectorAll('.pre button').forEach(b=>b.onclick=()=>{
    const [core,max,qt,cap,n]=b.dataset.p.split(',');
    inp('core').value=core; inp('inf').checked=max==='inf'; if(max!=='inf')inp('max').value=max; inp('qt').value=qt; if(qt==='abq')inp('cap').value=cap; inp('n').value=n;
    el.querySelectorAll('.pre button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    reset(); for(let i=0;i<+n;i++)add(); draw();
  });
  reset();
}

/* ---------- rejection demo ---------- */
function initReject(el){
  const D={
    'AbortPolicy':{rows:[['task0','ran on pool thread 1','t'],['task1','waited in the queue, then ran on pool thread 1','t'],['task2','REJECTED: execute() threw RejectedExecutionException in main','r']],sum:'Ran 2 of 3. The caller got an exception.'},
    'DiscardPolicy':{rows:[['task0','ran on pool thread 1','t'],['task1','waited in the queue, then ran on pool thread 1','t'],['task2','dropped silently — no error, no trace','r']],sum:'Ran 2 of 3. Nobody was told.'},
    'DiscardOldestPolicy':{rows:[['task0','ran on pool thread 1','t'],['task1','was the oldest in the queue → removed, never ran','r'],['task2','took task1\u2019s place in the queue, then ran on pool thread 1','t']],sum:'Ran 2 of 3. The newest task won.'},
    'CallerRunsPolicy':{rows:[['task0','ran on pool thread 1','t'],['task1','waited in the queue, then ran on pool thread 1','t'],['task2','ran on main — the thread that called execute()','qq']],sum:'Ran 3 of 3. main was busy while running task2.'}
  };
  el.innerHTML='<div class="rj"><div class="pols" role="group" aria-label="Rejection policy">'+Object.keys(D).map(k=>'<button aria-pressed="false" data-k="'+k+'">'+k+'</button>').join('')+'</div><div data-o="res"></div></div>';
  function show(k){
    el.querySelectorAll('.pols button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
    const d=D[k];
    el.querySelector('[data-o=res]').innerHTML=d.rows.map(r=>'<div class="row"><b>'+r[0]+'</b><span class="'+r[2]+'">'+r[1]+'</span></div>').join('')+'<p class="sum">'+d.sum+'</p>';
  }
  el.querySelectorAll('.pols button').forEach(b=>b.onclick=()=>show(b.dataset.k));
  show('AbortPolicy');
}

render(false);
</script>
