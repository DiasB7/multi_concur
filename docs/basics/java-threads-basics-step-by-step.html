 O(`main completed
daemon completed
daemon finally
regular thread completed`),
 P(`Now the JVM waits for the normal thread, so the daemon gets its second and completes normally.`),
 R(`Daemons only live as long as some normal thread does.`)),
S("When daemons are right",
 P(`"So what are daemons for?" A student said "monitoring", and the lecturer accepted the keyword.`),
 P(`A daemon fits when it's <b>helper work that means nothing once the program is gone</b>, and it holds <b>no external resources</b>.`),
 P(`Examples: publishing memory usage, extra diagnostics logging, housekeeping timers, cache expiry.`),
 R(`Daemon = background helper with nothing to clean up.`)),
S("Example: a heartbeat daemon",
 C(String.raw`Thread heartbeat = new Thread(() -> {
    Runtime rt = Runtime.getRuntime();
    while (true) {
        System.out.println("[heartbeat] used memory: "
                + (rt.totalMemory() - rt.freeMemory()) / 1_000_000 + " MB");
        sleep(300);
    }
}, "heartbeat");
heartbeat.setDaemon(true);
heartbeat.start();

sleep(1000);                                 // the real work
System.out.println("main: work done, exiting");`),
 O(`[heartbeat] used memory: 16 MB
[heartbeat] used memory: 16 MB
[heartbeat] used memory: 16 MB
[heartbeat] used memory: 16 MB
main: work done, exiting`),
 P(`The heartbeat never stops by itself (<code>while (true)</code>). That's fine: when main is done, the JVM exits and the daemon goes with it. Exactly what a helper should do.`),
 R(`A good daemon: useful while the app runs, harmless to kill.`)),
S("The trap",
 Y(`"If the daemon holds a DB connection and we kill it instantly, the other side cleans up by timeout. Many such threads grab all the connections, get shot, and the external system waits 30 seconds for each before it notices."`),
 P(`More precisely: when the JVM exits, the OS closes all its sockets, so a database usually notices quickly and rolls back open transactions. The real damage is the work cut in half: unflushed buffers, half-written files, un-acknowledged messages, and remote locks or leases that are only freed <b>by timeout</b>.`),
 P(`So: holds anything that needs a clean release → <b>not</b> a daemon. Make it a normal thread that can be stopped (chapter 19).`),
 R(`Resources to release → never a daemon.`)),
S("★ Deeper: cleanup at exit — shutdown hooks",
 P(`The lecturer mentioned there are ways to exit gracefully when the program closes. In Java that's a <b>shutdown hook</b>: a thread the JVM runs while shutting down.`),
 C(String.raw`public static void main(String[] args) throws Exception {
    Runtime.getRuntime().addShutdownHook(new Thread(() ->
            System.out.println("shutdown hook: flushing logs, closing connections")));

    Thread d = new Thread(() -> {
        try { Thread.sleep(5000); }
        catch (InterruptedException e) { }
        finally { System.out.println("daemon finally"); }
    });
    d.setDaemon(true);
    d.start();

    if (args.length > 0 && args[0].equals("exit")) System.exit(3);
    if (args.length > 0 && args[0].equals("wait")) Thread.sleep(60_000);   // stay alive to be killed
    System.out.println("main completed");
}`),
 TB(`<tr><th>How the program ended</th><th>Hook ran?</th><th>Daemon's finally?</th><th>Exit code</th></tr>
 <tr><td>main finished normally</td><td>yes</td><td>no</td><td>0</td></tr>
 <tr><td><code>System.exit(3)</code></td><td>yes</td><td>no</td><td>3</td></tr>
 <tr><td><code>kill</code> (SIGTERM, e.g. <code>docker stop</code>; Ctrl+C sends the similar SIGINT)</td><td>yes</td><td>no</td><td>143 = 128 + 15</td></tr>
 <tr><td><code>kill -9</code> (SIGKILL)</td><td><b>no</b></td><td>no</td><td>137 = 128 + 9</td></tr>`),
 P(`All four cases were run for real. The daemon's <code>finally</code> never ran. The shutdown hook did, except on <code>kill -9</code>, which gives the JVM no chance at all.`),
 P(`Keep hooks short, and don't rely on them for anything critical: power loss, <code>kill -9</code> or a JVM crash skip them.`),
 R(`Need cleanup at exit? A shutdown hook, not a daemon's finally.`)),
S("Two more facts (tested)",
 P(`<b>1.</b> A thread created by a daemon is a daemon by default (it copies the flag).`),
 O(`child of daemon isDaemon=true`),
 P(`<b>2.</b> Virtual threads are <b>always</b> daemons:`),
 O(`setDaemon(false) on virtual: java.lang.IllegalArgumentException: 'false' not legal for virtual threads`),
 P(`The JVM won't wait for virtual threads. Use an executor with <code>close()</code>, or <code>join()</code>.`),
 R(`Daemon-ness is inherited. Virtual = always daemon.`))
]},

{part:"02",t:"Designing a stoppable thread",steps:[
S("The problem",
 P(`The lecturer called this <b>thread design</b> — the part he says most candidates fail.`),
 C(String.raw`Thread t = new Thread(() -> { while (true) System.out.println("kek"); });
t.start();
Thread.sleep(2000);
t.interrupt();       // does it stop?
Thread.sleep(1000);
System.out.println("1 s after interrupt(): alive=" + t.isAlive()
        + " state=" + t.getState() + " flag=" + t.isInterrupted());`),
 P(`The group voted: yes. Reality (tested):`),
 O(`1 s after interrupt(): alive=true state=RUNNABLE flag=true`),
 P(`The "kek"s keep coming.`),
 R(`interrupt() did not stop the loop.`)),
S("What interrupt() really is",
 Y(`"interrupt() is a lightweight reminder: 'buddy, you've been asked to leave.' It doesn't force anything. If the thread is RUNNABLE and busy, only a flag is set."`),
 P(`You <b>can</b> read the flag: <code>Thread.currentThread().isInterrupted()</code>. But nothing makes you.`),
 R(`interrupt() = set a flag. That's all.`)),
S("Picture it: a tap on the shoulder",
 AN(`<code>interrupt()</code> is a <b>tap on the shoulder</b>: "please stop".`),
 P(`If the person is asleep (<code>sleep</code>, <code>wait</code>), the tap wakes them up. That's the <code>InterruptedException</code>.`),
 P(`If they're working with headphones on (a busy loop), they won't notice — unless they glance at their shoulder now and then (checking <code>isInterrupted()</code>).`),
 R(`interrupt() only works on threads that listen.`)),
S("Who can interrupt a thread?",
 P(`Only code that calls <code>t.interrupt()</code>. The JVM doesn't interrupt threads by itself.`),
 P(`Typical callers: <code>executor.shutdownNow()</code>, <code>future.cancel(true)</code>, a framework stopping the app, or your own code.`),
 Y(`"Who can interrupt our main thread? Nobody. In our program nobody will." — the lecturer, when he skipped handling InterruptedException in a small demo`),
 P(`So in a tiny demo, a rough catch in <code>main</code> is harmless. In worker code (anything that might run in a pool), handle it properly with this chapter's pattern.`),
 R(`Interrupts come only from someone calling interrupt().`)),
S("When the flag becomes an exception",
 P(`Waiting methods <b>throw <code>InterruptedException</code></b> if the flag is set before or during the wait:`),
 P(`<code>Thread.sleep</code>, <code>Object.wait</code>, <code>Thread.join</code>, <code>BlockingQueue.take</code>, <code>Future.get</code>, <code>Lock.lockInterruptibly</code>, …`),
 P(`When they throw, they <b>clear the flag</b>.`),
 O(`sleep with flag already set throws immediately; flag now=false`),
 R(`Waiting methods turn the flag into an exception — and clear it.`)),
S("Where interrupt works differently (tested)",
 P(`<ul><li><code>LockSupport.park()</code>: returns, but <b>no exception</b>; flag stays <code>true</code>.</li>
 <li>A thread <code>BLOCKED</code> on <code>synchronized</code>: <b>ignores it</b> — stays BLOCKED; only the flag is set.</li>
 <li>Classic socket IO on a <b>platform</b> thread: <b>ignores it</b> — kept waiting in <code>accept()</code>, still RUNNABLE.</li>
 <li>The same socket IO on a <b>virtual</b> thread: reacts — the socket is closed and a <code>SocketException</code> is thrown.</li>
 <li>NIO channels: react — channel closed, <code>ClosedByInterruptException</code>.</li></ul>`),
 O(`virtual thread in accept(), interrupted -> SocketException; socket closed=true`),
 R(`Not everything reacts to interrupt, and not always with an exception.`)),
S("The sleep version stops",
 P(`Put <code>Thread.sleep(100)</code> in the loop. The same <code>interrupt()</code> now stops it (tested, interrupt after 350 ms):`),
 C(String.raw`Thread t = new Thread(() -> {
    try {
        while (true) { System.out.println("kek"); Thread.sleep(100); }
    } catch (InterruptedException e) {
        System.out.println("caught InterruptedException; flag now="
                + Thread.currentThread().isInterrupted());
    }
});`),
 O(`kek
kek
kek
kek
caught InterruptedException; flag now=false`),
 Y(`"We happened to be sleeping when the flag arrived, and sleep threw. If you didn't design a check into your loop and weren't lucky enough to hit a sleep or wait, there's nothing you can do about that thread."`),
 R(`Luck isn't a design. Check the flag on purpose.`)),
S("The correct pattern",
 C(String.raw`Thread worker = new Thread(() -> {
    while (!Thread.currentThread().isInterrupted()) {   // 1. check in every loop
        try {
            doUnitOfWork();
            Thread.sleep(100);                          // 2. waiting calls throw
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt();         // 3. restore the flag
            break;                                      //    and leave
        }
    }
    cleanup();                                          // 4. clean exit
});`),
 O(`worker cleaned up and left, flag=true`),
 R(`Check the flag. Catch the exception. Restore the flag. Clean up.`)),
S("Why restore the flag (step 3)?",
 P(`<code>sleep</code>/<code>wait</code> <b>cleared</b> the flag when they threw.`),
 P(`If your code isn't the thread's owner (e.g. it runs inside a pool), code higher up must still see that an interrupt happened.`),
 P(`An empty <code>catch (InterruptedException e) {}</code> "swallows" it. One of the most common real bugs.`),
 R(`Never swallow InterruptedException.`)),
S("Example: the swallowed interrupt",
 C(String.raw`Thread bad = new Thread(() -> {
    while (!Thread.currentThread().isInterrupted()) {
        try {
            Thread.sleep(100);
        } catch (InterruptedException e) {
            // ignored   <- the bug
        }
    }
    System.out.println("worker: stopped");
});
bad.setDaemon(true);                         // only so this demo can exit
bad.start();
Thread.sleep(300);
bad.interrupt();
bad.join(1000);
System.out.println("worker alive 1 s after interrupt()? " + bad.isAlive());`),
 O(`worker alive 1 s after interrupt()? true`),
 P(`The interrupt arrived during <code>sleep</code>. <code>sleep</code> threw and <b>cleared</b> the flag. The empty catch ignored it. The loop checked the flag: false. Keep going. Forever.`),
 P(`Now replace the comment with <code>Thread.currentThread().interrupt();</code>:`),
 O(`worker: stopped
worker alive 1 s after interrupt()? false`),
 R(`Swallowing the interrupt = a thread that can't be stopped.`)),
S("isInterrupted() vs interrupted()",
 Y(`"There are two variants: in one you read the state and it resets, in the other it doesn't. For our purposes isInterrupted() is enough."`),
 TB(`<tr><th>Call</th><th>Static?</th><th>Clears the flag?</th><th>Use when</th></tr>
 <tr><td><code>t.isInterrupted()</code></td><td>no</td><td><b>no</b></td><td>checking (your loop, another thread)</td></tr>
 <tr><td><code>Thread.interrupted()</code></td><td>yes, current thread only</td><td><b>yes</b></td><td>you handle the interrupt and want to consume it</td></tr>`),
 O(`isInterrupted=true then again true
Thread.interrupted()=true then isInterrupted=false`),
 R(`isInterrupted reads. interrupted() reads and clears.`)),
S("stop(), suspend(), resume(): gone",
 P(`<code>stop()</code>: deprecated since Java 1.2. In JDK 21 it just throws (tested):`),
 O(`stop():    UnsupportedOperationException
suspend(): UnsupportedOperationException
resume():  UnsupportedOperationException`),
 P(`Why <code>stop()</code> was abandoned: killing a thread at a random instruction released its locks with data half-updated. Other threads then saw broken objects.`),
 P(`<code>suspend()</code>/<code>resume()</code> caused deadlocks (a suspended thread kept its locks).`),
 R(`There is no way to kill a thread in modern Java.`)),
S("yield(): don't",
 P(`<code>Thread.yield()</code> = a wish: "give my CPU time to other threads". The scheduler may ignore it.`),
 Y(`"It made sense in embedded-style optimisation; bots still recommend it; the general recommendation is don't."`),
 P(`Only modern use: inside spin-wait loops in lock-free code — and there <code>Thread.onSpinWait()</code> is the better hint.`),
 R(`yield() is a hint that usually does nothing useful.`)),
S("Interview: \"Can you stop a thread?\"",
 P(`First ask back: <b>"What do you mean by stop?"</b>`),
 P(`<ul><li><b>Force RUNNABLE → TERMINATED?</b> No. Not possible (no <code>stop()</code>).</li>
 <li><b>RUNNABLE → WAITING and back?</b> Yes: <code>LockSupport.park()</code> / <code>unpark(t)</code>. Locks are built on this.</li>
 <li><b>Ask it politely to finish?</b> Yes: <code>interrupt()</code> + a loop designed for it. The normal answer.</li>
 <li><b>Kill the whole process?</b> <code>System.exit(n)</code>. A student suggested it live; the lecturer tried it and it worked. It ends the <b>process</b>, not the thread: "an emergency exit with a non-zero code — a very bad idea in production, a last resort."</li>
 <li><b>It's a daemon?</b> Nobody asks it; it's killed at JVM exit.</li></ul>`),
 R(`Reframe first. Then: interrupt + cooperative loop.`)),
S("LockSupport.park() / unpark()",
 C(String.raw`Thread worker = new Thread(() -> {
    System.out.println("worker: parking...");
    LockSupport.park();                                   // RUNNABLE -> WAITING
    System.out.println("worker: unparked, interrupted="
            + Thread.currentThread().isInterrupted());
});
worker.start();
Thread.sleep(100);
System.out.println("main sees worker state=" + worker.getState());
LockSupport.unpark(worker);                               // WAITING -> RUNNABLE
worker.join();`),
 O(`worker: parking...
main sees worker state=WAITING
worker: unparked, interrupted=false`),
 P(`(After <code>join()</code>, <code>worker.getState()</code> is <code>TERMINATED</code>.)`),
 R(`park() = pause me. unpark(t) = let t continue.`)),
S("park(): four facts to remember",
 P(`<ol><li><b>Permit-based</b>: <code>unpark</code> <i>before</i> <code>park</code> leaves a permit, so the next <code>park</code> returns at once. (Tested: returned in 0 ms.) No lost wake-up, unlike <code>notify</code> before <code>wait</code>.</li>
 <li>But the thread must be <b>started</b>: <code>unpark</code> on an unstarted thread does nothing. (Tested: the permit was lost; park waited the full 300 ms.)</li>
 <li><code>park</code> can return for <b>no reason</b> (spuriously) — always call it in a loop that re-checks your condition.</li>
 <li>If interrupted, <code>park</code> returns without an exception. Check the flag.</li></ol>`),
 P(`<code>ReentrantLock</code>, <code>Semaphore</code>, <code>CountDownLatch</code>, AQS — all built on <code>LockSupport</code>.`),
 R(`park in a loop; unpark only started threads.`))
]},

{part:"02",t:"Virtual threads",steps:[
S("The problem they solve",
 P(`IO-bound work needs <b>many</b> things happening at once, because each spends most of its life waiting.`),
 P(`But each platform thread costs ~1 MB and an OS scheduling slot.`),
 Y(`"Come to the OS with 10,000 threads and it says: relax, I'm not scheduling 10,000. You'll just get enormous waiting." — and before that, probably OOM.`),
 P(`Stuck: few threads → cores idle while everyone waits. Many threads → the OS chokes. The old way out was callbacks / reactive code (hard to write and read).`),
 R(`Platform threads are too heavy for massive waiting.`)),
S("The idea",
 Y(`"To us a virtual thread looks exactly like a normal thread — same API, same blocking calls. But while it runs it borrows a real thread; the moment it waits, it detaches — 'I'm going to sleep, whoever has work, take the real thread'. The real thread is never blocked."`),
 C(`virtual threads (cheap, thousands..millions):  V1  V2  V3  V4  V5  V6  V7  V8 ...
                                                  \\  |   |  /    \\   |   /
"mounted" only while running                       \\ |   | /      \\  |  /
carrier (platform) threads, ~ number of cores:     C1   C2        C3   C4   <- a ForkJoinPool
                                                     \\   |         |   /
the OS scheduler only sees the carriers:              └──┴─────────┴──┘`,'text'),
 R(`Virtual threads borrow real threads only while running.`)),
S("Picture it: waiters in a restaurant",
 AN(`<b>Platform threads</b> = one waiter per table, who stands at the table while the kitchen cooks. 100 tables = 100 waiters, mostly standing still.`),
 P(`<b>Virtual threads</b> = 4 waiters (carriers) for 100 tables. A waiter takes an order, passes it to the kitchen, and serves another table while the food cooks. When a dish is ready, <b>any</b> free waiter brings it.`),
 P(`The tables are the virtual threads. The waiters are the carrier threads. Nobody stands around waiting.`),
 R(`Virtual threads: the waiter never waits with the customer.`)),
S("Mount and unmount",
 P(`V3 calls <code>Thread.sleep</code>, <code>socket.read</code>, <code>queue.take</code>, <code>lock.lock()</code>…`),
 P(`→ The JVM <b>unmounts</b> V3 from its carrier. V3's stack is copied to the heap.`),
 P(`→ Another ready virtual thread is mounted on that carrier.`),
 P(`→ When V3's wait ends, it continues on <b>any</b> free carrier.`),
 P(`The OS sees ~10 always-busy carriers instead of 10,000 mostly idle threads.`),
 Y(`"When there are only 10 real threads, the OS schedules them far more often; all the waiting moves into a different atmosphere."`),
 R(`Waiting costs a small heap copy, not a whole OS thread.`)),
S("\"Doesn't saving the stack cost something?\"",
 Y(`"Maybe it does, but by the results virtual threads still win."`),
 P(`Saving a small stack to the heap is far cheaper than an OS context switch.`),
 P(`Same idea as <b>Kotlin coroutines</b> and <b>Go goroutines</b>: lightweight threads scheduled in user space.`),
 R(`Cheap switching is the whole trick.`)),
S("The numbers (tested)",
 P(`10,000 tasks, each <code>Thread.sleep(10 ms)</code>:`),
 O(`10 platform threads, 10k x sleep(10ms): 10092 ms   <- 10,000 × 10 ms / 10 threads
virtual threads,     10k x sleep(10ms):   304 ms   <- all sleep at the same time (varies per run)`),
 P(`(This machine has 1 core. The virtual threads still win, because the tasks are waiting, not computing.)`),
 R(`For waiting work: virtual threads win by a lot.`)),
S("What a virtual thread looks like (tested)",
 O(`virtual: isVirtual=true isDaemon=true state=NEW
virtual sleeping: TIMED_WAITING
inside virtual: VirtualThread[#33]/runnable@ForkJoinPool-1-worker-1   <- its carrier`),
 P(`Everything from chapters 16–19 still applies: same six states, same <code>interrupt()</code>, same design rules.`),
 R(`Same Thread API. Always daemon.`)),
S("How to create them",
 C(String.raw`// one-off
Thread.ofVirtual().name("vt-1").start(() -> work());
Thread.startVirtualThread(() -> work());

// the normal way: one virtual thread per task
try (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor()) {
    for (int i = 0; i < 100_000; i++) ex.submit(() -> callSomeHttpService());
}   // close() waits for all tasks here`),
 R(`Normal way: newVirtualThreadPerTaskExecutor in try-with-resources.`)),
S("Example: calling 3 services",
 C(String.raw`static String call(String service, int ms) throws InterruptedException {
    Thread.sleep(ms);                        // pretend network call
    return service + ": ok";
}

public static void main(String[] args) throws Exception {
    long t0 = System.currentTimeMillis();
    System.out.println(call("user-service", 300));
    System.out.println(call("order-service", 500));
    System.out.println(call("price-service", 700));
    System.out.println("one after another: " + (System.currentTimeMillis() - t0) + " ms");

    t0 = System.currentTimeMillis();
    try (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor()) {
        Future<String> user   = ex.submit(() -> call("user-service", 300));
        Future<String> orders = ex.submit(() -> call("order-service", 500));
        Future<String> prices = ex.submit(() -> call("price-service", 700));
        System.out.println(user.get());
        System.out.println(orders.get());
        System.out.println(prices.get());
    }
    System.out.println("at the same time:  " + (System.currentTimeMillis() - t0) + " ms");
}`),
 O(`user-service: ok
order-service: ok
price-service: ok
one after another: 1503 ms
user-service: ok
order-service: ok
price-service: ok
at the same time:  714 ms`),
 P(`One after another: 300 + 500 + 700 = 1500 ms. At the same time: about as long as the slowest call, ~700 ms.`),
 P(`The code still looks simple: <code>call()</code> just waits, <code>get()</code> just waits. No callbacks.`),
 R(`Parallel calls: total ≈ the slowest call, not the sum.`)),
S("Example: one service is too slow",
 C(String.raw`static String call(String service, int ms) throws InterruptedException {
    Thread.sleep(ms);
    return service + ": ok";
}

public static void main(String[] args) throws Exception {
    long t0 = System.currentTimeMillis();
    try (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor()) {
        Future<String> user   = ex.submit(() -> call("user-service", 300));
        Future<String> prices = ex.submit(() -> call("price-service", 5000));   // too slow
        System.out.println(user.get(1, TimeUnit.SECONDS));
        try {
            System.out.println(prices.get(1, TimeUnit.SECONDS));
        } catch (TimeoutException e) {
            prices.cancel(true);             // interrupts that virtual thread
            System.out.println("price-service: timed out, using cached prices");
        }
    }
    System.out.println("total: " + (System.currentTimeMillis() - t0) + " ms");
}`),
 O(`user-service: ok
price-service: timed out, using cached prices
total: 1314 ms`),
 P(`Total ≈ 0.3 s (user-service) + 1 s (the timeout for prices).`),
 P(`<code>get(1, SECONDS)</code> waits at most 1 s. On timeout, <code>cancel(true)</code> interrupts that virtual thread, so <code>close()</code> doesn't sit through the full 5 s.`),
 R(`Always put a timeout on remote calls.`)),
S("Example: 10,000 users at once",
 C(String.raw`long t0 = System.currentTimeMillis();
AtomicInteger served = new AtomicInteger();
try (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor()) {
    for (int i = 0; i < 10_000; i++) {
        ex.submit(() -> { Thread.sleep(1000); served.incrementAndGet(); return null; });
    }
}
System.out.println(served.get() + " users served in " + (System.currentTimeMillis() - t0) + " ms");`),
 O(`10000 users served in 1125 ms`),
 P(`10,000 threads, each waiting 1 s, all done in about 1 s — on a machine with <b>1 core</b>.`),
 P(`10,000 platform threads would reserve about 10 GB of stack address space, and the OS would struggle to schedule them.`),
 R(`Virtual threads make "one thread per user" possible again.`)),
S("When to use them (the lecturer's view)",
 Y(`"Everything is moving towards: just use virtual threads everywhere; they decide internally how many real threads they need. At minimum: lots of IO ⇒ virtual threads, 100 %. Lots of IO means lots of blocking, lots of blocking would mean lots of real threads — memory, OS scheduling — so: virtual threads. Inside there may be a dozen carriers, and since we'd almost always be sleeping on a block anyway, the efficiency is cosmic. I can't pull an example out of my head where real threads are definitely better."`),
 P(`(The next screen gives you those examples anyway — interviewers ask "when not?".)`),
 Y(`"This feature could have sunk Java. Java could have lost to Kotlin and Go. The language was saved by it."`),
 R(`Lots of IO → virtual threads. No doubt.`)),
S("When platform threads are still better",
 TB(`<tr><th>Situation</th><th>Use</th><th>Why</th></tr>
 <tr><td>Pure CPU work</td><td>platform pool ≈ cores (or ForkJoinPool)</td><td>no waiting to hide; still only N cores</td></tr>
 <tr><td>Hot loops that must never be paused (trading, pinned to cores)</td><td>platform, pinned</td><td>virtual threads unmount on blocking and can't be pinned to a core</td></tr>
 <tr><td>Heavy <code>ThreadLocal</code> caches</td><td>platform</td><td>millions of threads × cache = memory explosion; use <code>ScopedValue</code> (preview in 21, final in JDK 25)</td></tr>
 <tr><td>Blocking inside <code>synchronized</code> on JDK ≤ 23, or inside native (JNI) code on any JDK</td><td>platform, or <code>ReentrantLock</code> instead of synchronized</td><td>the virtual thread gets <b>pinned</b> to its carrier and can starve the carrier pool</td></tr>
 <tr><td>IO-heavy: web servers, service calls, DB, message consumers</td><td><b>virtual</b></td><td>the 100 % case</td></tr>`),
 P(`The lecturer believed the <code>synchronized</code> bug was "fixed in fresh 21 builds". Precisely: the fix (for <code>synchronized</code> and <code>Object.wait</code>) arrived in <b>JDK 24 (JEP 491)</b> and was not backported to 21. On JDK 21, avoid blocking inside <code>synchronized</code> on virtual threads, or use <code>ReentrantLock</code>. Pinning inside native code remains on every JDK.`),
 R(`CPU, hot loops, big ThreadLocals, old-JDK synchronized → platform.`)),
S("Don't pool virtual threads",
 P(`They're meant to be created per task and thrown away.`),
 P(`And don't expect CPU-heavy loops on them to run faster than the number of carriers (≈ cores).`),
 R(`One virtual thread per task. No pool.`)),
S("\"How is this different from a thread pool?\"",
 Y(`"A thread pool holds real threads. A pool of 10,000 real threads: you probably can't get the memory, and the OS won't schedule them anyway. A pool of 10 real threads is fast, but only 10 things can be blocked at once. Virtual threads give you 10,000 things blocked at once on top of ~10 real threads."`),
 P(`Pools and thread <b>types</b> are separate topics.`),
 R(`Pool = reuse a few real threads. Virtual = many cheap threads on a few real ones.`)),
S("\"If the OS already parks blocked threads, why virtual threads?\"",
 P(`A student asked this at the end of the lecture.`),
 P(`Parking frees the <b>CPU core</b>, but not the <b>thread</b>. Each parked platform thread still holds its stack (~1 MB reserved) and an OS thread slot.`),
 P(`So 10,000 waiting tasks = 10,000 OS threads: memory trouble, and a scheduler juggling thousands of threads.`),
 P(`With virtual threads, a waiting task costs a small object on the heap, and only about as many real threads as cores exist.`),
 Y(`"It's not such a genius that it would say: I'm so efficient, give me a thousand threads. In practice you'd fall over with OutOfMemory." — the lecturer`),
 R(`OS parking saves CPU. Virtual threads save threads.`)),
]},

{part:"02",t:"Kinds of threads side by side",steps:[
S("Platform vs daemon vs virtual",
 TB(`<tr><th></th><th>Platform (non-daemon)</th><th>Daemon</th><th>Virtual (JDK 21+)</th></tr>
 <tr><td>OS thread behind it</td><td>1 : 1</td><td>1 : 1</td><td>many : few (carriers)</td></tr>
 <tr><td>Cost</td><td>~1 MB stack, OS call</td><td>same</td><td>small stack on the heap, grows as needed</td></tr>
 <tr><td>JVM waits for it at exit</td><td><b>yes</b></td><td>no (killed, finally skipped)</td><td>no (always daemon)</td></tr>
 <tr><td>Blocking (sleep, IO, wait)</td><td>blocks the OS thread</td><td>blocks the OS thread</td><td>unmounts; carrier stays free</td></tr>
 <tr><td>Typical count</td><td>tens … low thousands</td><td>few</td><td>thousands … millions</td></tr>
 <tr><td>Use for</td><td>CPU work, hot loops, affinity</td><td>background helpers, no resources</td><td>IO-bound, high concurrency</td></tr>
 <tr><td>Pool them?</td><td>yes (03, 04)</td><td>rarely</td><td><b>no</b> — one per task</td></tr>`),
 R(`Three kinds. Each has its job.`))
]},

{part:"02",t:"Low-latency notes",steps:[
S("For trading interviews, part 1",
 P(`<b>Affinity</b>: pin critical threads to isolated cores (<code>isolcpus</code>, <code>taskset</code>, OpenHFT Affinity). "The only thing we can really do to the scheduler."`),
 P(`<b>Never sleep or block on the hot path</b>: parking and waking a thread costs microseconds (OS context switch, cold caches).`),
 P(`Hot loops <b>busy-spin</b> on a dedicated core instead:`),
 C(String.raw`while (!ready) Thread.onSpinWait();   // burn a core to save latency`),
 R(`Low latency = spin, don't sleep. The opposite of virtual threads.`)),
S("For trading interviews, part 2",
 P(`<b>Fewer threads than cores</b> on the hot path, so nothing is ever descheduled.`),
 P(`One thread per stage (network in → parse → strategy → order out), handing data over through single-producer / single-consumer queues (Disruptor-style ring buffers).`),
 P(`Everything in RAM. The bottleneck is the <b>network card</b>, not the disk.`),
 P(`Virtual threads are for the <b>non-critical</b>, IO-heavy parts (risk reports, REST, monitoring), not the tick-to-trade path.`),
 R(`Hot path: few pinned spinning threads. Everything else: virtual.`))
]},

{part:"02",t:"Pros and cons cheat sheet",steps:[
S("Each tool, pro and con",
 TB(`<tr><th>Tool</th><th>Pro</th><th>Con</th></tr>
 <tr><td><code>new Thread().start()</code></td><td>trivial</td><td>expensive per task, no reuse, no limit, no exception handling, unnamed; not for app code</td></tr>
 <tr><td>Daemon</td><td>never delays JVM exit</td><td>killed without finally; unsafe with external resources</td></tr>
 <tr><td>Virtual</td><td>cheap; simple blocking code; massive IO concurrency; executor auto-closes</td><td>no CPU gain; can't be pinned to a core; synchronized pinning before JDK 24; ThreadLocal blow-up; always daemon</td></tr>
 <tr><td><code>interrupt()</code></td><td>safe, cooperative</td><td>works only if the loop was designed for it; classic blocking IO may ignore it</td></tr>
 <tr><td><code>stop()</code> / <code>System.exit()</code></td><td>it stops</td><td>stop() is gone (throws); exit() kills the whole process</td></tr>`),
 R(`No free lunch — know each tool's cost.`))
]},

{part:"02",t:"Interview practice (file 02)",steps:[
S("Questions 1–6",
 P(`Answer out loud first. Then open.`),
 Q(`Define a thread in one sentence.`,`<p>An independent activity with its own execution stack, which shares memory with the other threads of the same process.</p>`),
 Q(`start() vs run()? What does a second start() do?`,`<p>start() creates a new thread and runs the Runnable there. run() is a normal call on the current thread. Second start() → IllegalThreadStateException.</p>`),
 Q(`Name all six states. Why is there no RUNNING? Why isn't INTERRUPTED a state?`,`<p>NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED. RUNNING is OS vocabulary; Java merges it into RUNNABLE. Interrupted is a flag, not a state.</p>`),
 Q(`WAITING vs TIMED_WAITING vs BLOCKED — which calls lead to each?`,`<p>WAITING: wait(), join(), park(). TIMED_WAITING: sleep(ms), wait(ms), join(ms), parkNanos/parkUntil. BLOCKED: entering synchronized while another thread holds the monitor (or re-taking it after wait).</p>`),
 Q(`Does main returning end the program? What about daemons?`,`<p>No — the JVM exits when the last non-daemon thread ends. Daemons are then killed, and their finally blocks don't run.</p>`),
 Q(`Why restore the interrupt flag after catching InterruptedException?`,`<p>Throwing cleared the flag. Code higher up (e.g. the pool that owns the thread) must still see that an interrupt was requested.</p>`),
 R(`Short, exact answers win interviews.`)),
S("Questions 7–10",
 Q(`"Stop this thread."`,`<p>Ask what "stop" means. Force-kill: impossible (stop() throws). Pause/resume: park/unpark. Politely: interrupt() + a cooperative loop (the normal answer). Whole process: System.exit — last resort.</p>`),
 Q(`Virtual threads: what problem, and how do they work?`,`<p>Problem: platform threads are too heavy for massive IO waiting. How: many virtual threads mount on a few carrier threads (a ForkJoinPool) and unmount when they block, so carriers never block.</p>`),
 Q(`When not to use virtual threads?`,`<p>Pure CPU work, hot loops that need pinning/affinity, heavy ThreadLocal caches, blocking inside synchronized before JDK 24 (or inside native code).</p>`),
 Q(`Why are virtual threads daemons, and why not pool them?`,`<p>They're always daemons by design (setDaemon(false) throws), so wait for them with an executor's close() or join(). They're cheap, so you create one per task; pooling adds nothing.</p>`),
 R(`If these feel easy, you're ready for files 03 and 04.`))
]},
{part:"Practice",t:"Practice: write it yourself",steps:[
S("How to practise",
 P(`Each exercise: read the task, then write the code yourself in your IDE.`),
 P(`Stuck? Open the <b>hint</b>. Done? Compare with the <b>solution</b>. Every solution here was run on JDK 21, with its real output.`),
 R(`Typing it yourself is what makes it stick.`)),
S("Exercise 1: sum an array with N threads",
 P(`Write <code>long parallelSum(long[] nums, int n)</code>. Split the array into n parts, one thread per part, and return the total.`),
 P(`Test: numbers 0 to 1,000,000 → the answer must be <b>500000500000</b>, for any n.`),
 Q(`Hint`,`<p>Give each thread its own slot in a <code>long[] partial</code> array, so no two threads write to the same place. Call <code>join()</code> on each thread before you read its slot.</p>`),
 SOL(String.raw`static long parallelSum(long[] nums, int n) throws InterruptedException {
    long[] partial = new long[n];                  // one slot per thread: no shared slot
    Thread[] threads = new Thread[n];
    int chunk = (nums.length + n - 1) / n;         // round up so nothing is left over
    for (int t = 0; t < n; t++) {
        int id = t, from = t * chunk, to = Math.min(nums.length, from + chunk);
        threads[t] = new Thread(() -> {
            long s = 0;
            for (int i = from; i < to; i++) s += nums[i];
            partial[id] = s;
        }, "summer-" + t);
        threads[t].start();
    }
    long total = 0;
    for (int t = 0; t < n; t++) {
        threads[t].join();                         // wait, and see its result
        total += partial[t];
    }
    return total;
}

public static void main(String[] args) throws Exception {
    long[] nums = new long[1_000_001];
    for (int i = 0; i < nums.length; i++) nums[i] = i;
    System.out.println("4 threads: " + parallelSum(nums, 4));
    System.out.println("3 threads: " + parallelSum(nums, 3));
}`,`4 threads: 500000500000
3 threads: 500000500000`),
 R(`Own slot per thread + join = correct parallel result.`)),
S("Exercise 2: fix the thread that never stops",
 P(`Take the visibility example from chapter 10 (<code>while (running) { }</code>). Make the worker stop after main sets <code>running = false</code>. Change as little as possible.`),
 Q(`Hint`,`<p>The worker keeps reading an old copy. Which keyword tells Java "another thread changes this field"?</p>`),
 SOL(`static volatile boolean running = true;     // the only change`,`main: set running = false
worker: saw running=false, stopping
main: worker still alive 3 s later? false`),
 R(`Shared flag → volatile.`)),
S("Exercise 3: a ticker you can stop",
 P(`A thread named "ticker" prints <code>tick 1</code>, <code>tick 2</code>, … every 200 ms.`),
 P(`Main lets it run for 1 s, then stops it with <code>interrupt()</code>. The ticker must print <code>ticker: stopped cleanly</code> and end in <code>TERMINATED</code>.`),
 Q(`Hint`,`<p>Loop while <code>!isInterrupted()</code>. In the catch around <code>sleep</code>, restore the flag.</p>`),
 SOL(String.raw`Thread ticker = new Thread(() -> {
    int n = 0;
    while (!Thread.currentThread().isInterrupted()) {
        System.out.println("tick " + (++n));
        try {
            Thread.sleep(200);
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt();    // restore -> the loop ends
        }
    }
    System.out.println("ticker: stopped cleanly");
}, "ticker");
ticker.start();
Thread.sleep(1000);
ticker.interrupt();
ticker.join();
System.out.println("ticker state: " + ticker.getState());`,`tick 1
tick 2
tick 3
tick 4
tick 5
ticker: stopped cleanly
ticker state: TERMINATED`),
 R(`Check the flag + restore it = a thread that stops on request.`)),
S("Exercise 4: load 5 pages at once",
 P(`<code>fetch(page, ms)</code> waits <code>ms</code> and returns <code>"page loaded"</code>. Load 5 pages that take 200, 400, 600, 800 and 1000 ms.`),
 P(`Use virtual threads. Print the results in page order. Total time: about 1 s, not 3 s.`),
 Q(`Hint`,`<p><code>newVirtualThreadPerTaskExecutor()</code> in try-with-resources. Submit each page, keep the <code>Future</code>s in a list, then <code>get()</code> them in order.</p>`),
 SOL(String.raw`static String fetch(String page, int ms) throws InterruptedException {
    Thread.sleep(ms);                               // pretend download
    return page + " loaded";
}

public static void main(String[] args) throws Exception {
    long t0 = System.currentTimeMillis();
    int[] times = {200, 400, 600, 800, 1000};
    List<Future<String>> results = new ArrayList<>();
    try (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor()) {
        for (int i = 0; i < times.length; i++) {
            String page = "page-" + (i + 1);
            int ms = times[i];
            results.add(ex.submit(() -> fetch(page, ms)));
        }
        for (Future<String> f : results) System.out.println(f.get());   // in order
    }
    System.out.println("all 5 pages in " + (System.currentTimeMillis() - t0) + " ms");
}`,`page-1 loaded
page-2 loaded
page-3 loaded
page-4 loaded
page-5 loaded
all 5 pages in 1016 ms`),
 R(`Total ≈ the slowest page.`)),
S("Exercise 5: spot the bug (1)",
 P(`"Downloading two files takes twice as long as expected." Why?`),
 C(String.raw`Thread a = new Thread(() -> download("file-1"));
Thread b = new Thread(() -> download("file-2"));
a.run();
b.run();
System.out.println("both downloads done");`),
 Q(`Your answer?`,`<p><code>run()</code> is a normal method call: both downloads run one after another, on <code>main</code>. Use <code>start()</code> on both, then <code>join()</code> both before printing.</p>`),
 R(`run() = no new thread.`)),
S("Exercise 6: spot the bug (2)",
 P(`"We call <code>shutdownNow()</code> on the pool, but this worker never ends." Why?`),
 C(String.raw`Runnable worker = () -> {
    while (!Thread.currentThread().isInterrupted()) {
        try {
            processNextBatch();
            Thread.sleep(500);
        } catch (InterruptedException e) {
            System.out.println("interrupted, but let's keep going");
        }
    }
};`),
 Q(`Your answer?`,`<p><code>shutdownNow()</code> interrupts the worker. The interrupt usually arrives during <code>sleep</code>, which throws and <b>clears</b> the flag. The catch doesn't restore it, so the loop condition sees "not interrupted" and continues forever.</p><p>Fix: <code>Thread.currentThread().interrupt();</code> in the catch (and/or <code>break</code>).</p>`),
 R(`Never swallow InterruptedException.`)),
S("Exercise 7: explain it out loud",
 Q(`Why can two threads both withdraw 100 from an account holding 100?`,`<p>Check-then-act: both check the balance before either subtracts, so both see 100. The check and the act must be one atomic step (e.g. <code>synchronized</code>).</p>`),
 Q(`Why does main print total = 0 in the parallel-sum example?`,`<p>It reads the fields before the threads have finished (or before their writes are visible). <code>join()</code> fixes both: it waits, and it guarantees main sees what they wrote.</p>`),
 Q(`Why does the flag loop never end without volatile?`,`<p>Visibility: nothing tells Java another thread changes the field, so the JIT may read it once and reuse the value forever. <code>volatile</code> forces a real read every time.</p>`),
 Q(`Why does interrupt() stop a thread in sleep() but not a thread in while (true) { }?`,`<p><code>interrupt()</code> only sets a flag. <code>sleep()</code> checks it and throws. A busy loop never checks it, so nothing happens.</p>`),
 Q(`Why are virtual threads fast for 10,000 waiting users, but no faster for heavy computing?`,`<p>While a virtual thread waits, it leaves its carrier, so a few carriers serve thousands of waiting threads. Computing never waits, so it can only use as many carriers as there are cores.</p>`),
 R(`If you can explain all five out loud, you've got the basics.`))
]}
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KW=new Set('abstract boolean break case catch class continue default do else extends final finally for if implements import instanceof int long new null private protected public return static super switch this throw throws true false try var void while'.split(' '));
function hlJava(line){
  // split off // comment (not inside a string)
  let inS=false, cut=-1;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='\\'&&inS){i++;continue}
    if(ch==='"'){inS=!inS;continue}
    if(!inS&&ch==='/'&&line[i+1]==='/'){cut=i;break}}
  const codePart=cut<0?line:line.slice(0,cut), com=cut<0?'':line.slice(cut);
  const re=/("(?:[^"\\]|\\.)*")|(@\w+)|\b(\d[\d_]*L?)\b|\b([A-Za-z_]\w*)\b/g;
  let out='',last=0,m;
  while((m=re.exec(codePart))){
    out+=esc(codePart.slice(last,m.index));
    if(m[1])out+='<span class="ts">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tk">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tn">'+m[3]+'</span>';
    else{const w=m[4]; if(KW.has(w))out+='<span class="tk">'+w+'</span>'; else if(/^[A-Z]/.test(w)&&!/^[A-Z_]+$/.test(w))out+='<span class="tt">'+w+'</span>'; else out+=w;}
    last=re.lastIndex;
  }
  out+=esc(codePart.slice(last));
  if(com)out+='<span class="tc">'+esc(com)+'</span>';
  return out;
}
function hl(src,lang){
  if(lang==='java')return src.split('\n').map(hlJava).join('\n');
  if(lang==='bash')return src.split('\n').map(l=>{const i=l.indexOf('  #');return i<0?esc(l):esc(l.slice(0,i))+'<span class="tc">'+esc(l.slice(i))+'</span>'}).join('\n');
  return esc(src);
}
function block(b){
  switch(b[0]){
    case 'p':return b[1].trim().startsWith('<')&&!b[1].trim().startsWith('<b')&&!b[1].trim().startsWith('<code')&&!b[1].trim().startsWith('<kbd')&&!b[1].trim().startsWith('<span')?b[1]:'<p>'+b[1]+'</p>';
    case 'code':return '<div class="codebox"><pre><code>'+hl(b[1],b[2])+'</code></pre></div>';
    case 'out':return '<div class="out"><div class="lbl">Output</div><pre><code>'+esc(b[1])+'</code></pre></div>';
    case 'rem':return '<p class="rem"><span>Remember</span>'+b[1]+'</p>';
    case 'quote':return '<p class="quote">'+b[1]+'</p>';
    case 'q':return '<details class="q'+(b[1]==='Hint'?' hint':'')+'"><summary>'+b[1]+'</summary><div class="a">'+b[2]+'</div></details>';
    case 'w':return '<div data-w="'+b[1]+'"></div>';
    case 'an':return '<div class="an"><span>Picture it</span>'+b[1]+'</div>';
    case 'sol':return '<details class="q sol"><summary>Solution</summary><div class="a"><div class="codebox"><pre><code>'+hl(b[1],'java')+'</code></pre></div>'+(b[2]?'<div class="out"><div class="lbl">Output</div><pre><code>'+esc(b[2])+'</code></pre></div>':'')+'</div></details>';
  }
  return '';
}

/* ---------- state ---------- */
const flat=[]; CH.forEach((c,ci)=>c.steps.forEach((s,si)=>flat.push({ci,si})));
function load(k,d){try{const v=localStorage.getItem('tb.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem('tb.'+k,JSON.stringify(v))}catch(e){}}
let idx=Math.min(Math.max(0,load('idx',0)|0),flat.length-1);
let seen=new Set(load('seen',[]));
let mode=load('mode','step')==='chapter'?'chapter':'step';

function stepCard(ci,si,withFocus){
  const s=CH[ci].steps[si];
  return '<article class="step"><h2'+(withFocus?' tabindex="-1" id="focus"':'')+'><span class="snum">'+(si+1)+'.</span>'+s.t+'</h2>'+s.x.map(block).join('')+'</article>';
}
function render(focus){
  const {ci,si}=flat[idx];
  const ch=CH[ci];
  seen.add(idx); save('seen',[...seen]); save('idx',idx);
  $('#chname').textContent='Chapter '+ci+': '+ch.t;
  const partTxt=ch.part==='Start'?'':(ch.part==='Practice'?'Practice, ':'File '+ch.part+', ');
  if(mode==='step'){
    $('#main').innerHTML=stepCard(ci,si,true);
    $('#pos').textContent=partTxt+'step '+(si+1)+' of '+ch.steps.length;
    $('#modebtn').textContent='Show whole chapter';
    $('#back').disabled=idx===0;
    $('#next').disabled=idx===flat.length-1;
    $('#next').textContent=idx===flat.length-1?'Finished':(si===ch.steps.length-1?'Next chapter':'Next');
  }else{
    $('#main').innerHTML=ch.steps.map((_,k)=>stepCard(ci,k,k===0)).join('');
    ch.steps.forEach((_,k)=>seen.add(flat.findIndex(f=>f.ci===ci&&f.si===k))); save('seen',[...seen]);
    $('#pos').textContent=partTxt+ch.steps.length+' steps';
    $('#modebtn').textContent='One step at a time';
    $('#back').disabled=ci===0;
    $('#next').disabled=ci===CH.length-1;
    $('#next').textContent='Next chapter';
  }
  $('#bar').style.width=((idx+1)/flat.length*100)+'%';
  document.querySelectorAll('[data-w]').forEach(el=>{const f=WIDGETS[el.dataset.w];if(f)f(el)});
  buildMap();
  if(focus){window.scrollTo(0,0);const f=$('#focus');if(f)f.focus({preventScroll:true});}
}
function go(d){
  if(mode==='step'){idx=Math.min(Math.max(0,idx+d),flat.length-1);}
  else{const ci=Math.min(Math.max(0,flat[idx].ci+d),CH.length-1);idx=flat.findIndex(f=>f.ci===ci);}
  render(true);
}
$('#next').onclick=()=>go(1); $('#back').onclick=()=>go(-1);
$('#modebtn').onclick=()=>{mode=mode==='step'?'chapter':'step';save('mode',mode);if(mode==='chapter'){idx=flat.findIndex(f=>f.ci===flat[idx].ci);}render(true)};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeMap();
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'||e.altKey||e.ctrlKey||e.metaKey)return;
  if(document.body.classList.contains('open'))return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
});

/* ---------- map ---------- */
function buildMap(){
  const cur=flat[idx];
  let h='';let k=0;
  let lastPart='';
  const PN={Start:'Start',"01":'File 01: Multithreading basics',"02":'File 02: What is a thread',Practice:'Practice'};
  CH.forEach((c,ci)=>{
    if(c.part!==lastPart){h+='<h3 class="parth">'+PN[c.part]+'</h3>';lastPart=c.part;}
    const done=c.steps.every((_,si)=>seen.has(flat.findIndex(f=>f.ci===ci&&f.si===si)));
    h+='<details'+(ci===cur.ci?' open':'')+'><summary>'+ci+'. '+c.t+(done?' ✓':'')+'</summary><ol>';
    c.steps.forEach((s,si)=>{const g=k++;
      h+='<li><button data-go="'+g+'" class="'+(ci===cur.ci&&(mode==='chapter'||si===cur.si)?'cur':'')+'"><span class="ck">'+(seen.has(g)?'✓':'')+'</span><span>'+(si+1)+'. '+s.t+'</span></button></li>';});
    h+='</ol></details>';
  });
  $('#maplist').innerHTML=h;
}
$('#maplist').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;idx=+b.dataset.go;if(mode==='chapter')mode='step',save('mode',mode);closeMap();render(true)});
function openMap(){document.body.classList.add('open');$('#mapbtn').setAttribute('aria-expanded','true');$('#closemap').focus()}
function closeMap(){if(!document.body.classList.contains('open'))return;document.body.classList.remove('open');$('#mapbtn').setAttribute('aria-expanded','false');$('#mapbtn').focus()}
$('#mapbtn').onclick=openMap; $('#closemap').onclick=closeMap; $('#scrim').onclick=closeMap;
$('#reset').onclick=()=>{seen=new Set();idx=0;save('seen',[]);save('idx',0);closeMap();render(true)};

/* ---------- widget: Amdahl ---------- */
const NS=[1,2,3,4,6,8,12,16,24,32,64,128,256,1024];
function initAmdahl(el){
  el.innerHTML=`<div class="wg am">
   <div class="ctl">
    <label>p = parallel fraction <b data-o="pv"></b><input type="range" min="0" max="100" value="90" data-k="p"></label>
    <label>n = processors <b data-o="nv"></b><input type="range" min="0" max="${NS.length-1}" value="3" data-k="n"></label>
   </div>
   <div class="big"><span data-o="s"></span><small data-o="sub"></small></div>
   <div class="tl"><div class="tlh">Time with 1 processor</div><div class="tbar" data-o="b1"></div></div>
   <div class="tl"><div class="tlh" data-o="bnh"></div><div class="tbar" data-o="bn"></div></div>
   <div class="legend"><span><i class="lg-s"></i>serial part (never shrinks)</span><span><i class="lg-p"></i>parallel part (split across n)</span></div>
   <div class="curve" data-o="curve" aria-label="Speed-up for different n"></div>
  </div>`;
  const q=s=>el.querySelector(s);
  function S(p,n){return 1/((1-p)+p/n)}
  function draw(){
    const p=+q('[data-k=p]').value/100, n=NS[+q('[data-k=n]').value], s=S(p,n), ceil=p>=1?Infinity:1/(1-p);
    q('[data-o=pv]').textContent=p.toFixed(2)+' ('+Math.round(p*100)+' %)';
    q('[data-o=nv]').textContent=n;
    q('[data-o=s]').textContent=s.toFixed(2)+'× faster';
    q('[data-o=sub]').textContent='Ceiling with infinite processors: '+(ceil===Infinity?'none (p = 1)':ceil.toFixed(1)+'×')+'. Efficiency: '+Math.round(s/n*100)+' % of the ideal '+n+'×.';
    q('[data-o=b1]').innerHTML=seg(1-p,'s',100)+seg(p,'p',100);
    const tn=(1-p)+p/n;
    q('[data-o=bnh]').textContent='Time with '+n+' processor'+(n>1?'s':'')+' = '+Math.round(tn*100)+' % of the original';
    q('[data-o=bn]').innerHTML=seg(1-p,'s',100)+seg(p/n,'p',100);
    q('[data-o=curve]').innerHTML=[1,2,4,8,16,64,256,1024].map(k=>{const v=S(p,k),w=Math.max(2,v/Math.min(ceil===Infinity?1024:ceil,1024)*100);
      return '<div class="cr"><span class="ck2">n = '+k+'</span><span class="cb"><i style="width:'+Math.min(100,w)+'%"></i></span><span class="cv">'+v.toFixed(2)+'×</span></div>'}).join('');
  }
  function seg(f,c,scale){return f<=0?'':'<i class="sg '+c+'" style="width:'+(f*scale)+'%"></i>'}
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw));
  draw();
}

function initRace(el){
  el.innerHTML=`<div class="wg rc">
   <div class="rcgrid">
    <div class="th" data-t="A"><div class="thh">Thread A</div><ol class="ops"><li>tmp = count</li><li>tmp = tmp + 1</li><li>count = tmp</li></ol><div class="reg">tmp = <b data-o="rA">–</b></div><button data-a="A">Thread A: next step</button></div>
    <div class="mem"><div class="thh">Shared heap</div><div class="cnt">count = <b data-o="count">0</b></div></div>
    <div class="th" data-t="B"><div class="thh">Thread B</div><ol class="ops"><li>tmp = count</li><li>tmp = tmp + 1</li><li>count = tmp</li></ol><div class="reg">tmp = <b data-o="rB">–</b></div><button data-a="B">Thread B: next step</button></div>
   </div>
   <div class="act"><button data-a="bad" class="main">Play the bad order</button><button data-a="good">Play a lucky order</button><button data-a="reset">Reset</button></div>
   <div class="verdict" data-o="v" role="status"></div>
   <div class="simlog" data-o="log"></div>
  </div>`;
  const q=s=>el.querySelector(s);
  let st, timer=null;
  function reset(){clearTimeout(timer);timer=null;st={count:0,A:{pc:0,reg:null},B:{pc:0,reg:null},log:[]};draw()}
  function step(t){
    const T=st[t]; if(T.pc>2)return;
    if(T.pc===0){T.reg=st.count;st.log.push(t+': read count → tmp = '+T.reg);}
    else if(T.pc===1){T.reg=T.reg+1;st.log.push(t+': tmp + 1 → tmp = '+T.reg+' (only in '+t+'\u2019s own stack)');}
    else {st.count=T.reg;st.log.push(t+': write count = '+T.reg);}
    T.pc++; draw();
  }
  function draw(){
    ['A','B'].forEach(t=>{const T=st[t];
      el.querySelectorAll('[data-t='+t+'] .ops li').forEach((li,i)=>{li.className=i<T.pc?'done':(i===T.pc?'cur':'')});
      q('[data-o=r'+t+']').textContent=T.reg===null?'–':T.reg;
      q('[data-a='+t+']').disabled=T.pc>2||!!timer;});
    q('[data-o=count]').textContent=st.count;
    const lg=q('[data-o=log]'); lg.innerHTML=st.log.length?st.log.map(l=>'<div>'+esc(l)+'</div>').join(''):'<div>Press a button to start.</div>'; lg.scrollTop=lg.scrollHeight;
    const done=st.A.pc>2&&st.B.pc>2;
    q('[data-o=v]').innerHTML=!done?'Both threads run count++ once. Expected result: 2.':(st.count===2?'<span class="t">count = 2. Correct — this time. One thread finished before the other read.</span>':'<span class="r">count = '+st.count+'. One update was lost: both threads read the same old value.</span>');
  }
  function play(seq){reset();const next=()=>{if(!seq.length){timer=null;draw();return}step(seq.shift());timer=setTimeout(next,matchMedia('(prefers-reduced-motion: reduce)').matches?0:550);};timer=setTimeout(next,0);draw()}
  q('[data-a=A]').onclick=()=>step('A'); q('[data-a=B]').onclick=()=>step('B');
  q('[data-a=bad]').onclick=()=>play(['A','B','A','B','A','B']);
  q('[data-a=good]').onclick=()=>play(['A','A','A','B','B','B']);
  q('[data-a=reset]').onclick=reset;
  reset();
}

/* ---------- widget: thread states ---------- */
function initStates(el){
  const ST=['NEW','RUNNABLE','BLOCKED','WAITING','TIMED_WAITING','TERMINATED'];
  el.innerHTML=`<div class="wg sx">
   <div class="stbox" data-o="boxes"></div>
   <div class="now" data-o="now"></div>
   <div class="acts" data-o="acts" role="group" aria-label="Actions"></div>
   <div class="act"><button data-a="reset">Start over (new Thread)</button></div>
   <div class="simlog" data-o="log" aria-live="polite"></div>
  </div>`;
  const q=s=>el.querySelector(s);
  let s, via, flag, log;
  const note=(msg)=>log.push(msg);
  function actions(){
    const A=[]; const go=(label,to,v,msg,extra)=>A.push({label,fn:()=>{const from=s;s=to;via=v;if(extra)extra();note(from+' → '+to+':  '+label+'. '+msg)}});
    const err=(label,msg)=>A.push({label,err:true,fn:()=>note('✗ '+label+' in '+s+':  '+msg)});
    if(s==='NEW'){go('start()','RUNNABLE',null,'The native OS thread is created now.');}
    else if(s==='RUNNABLE'){
      // a waiting call made while the interrupt flag is already set does not wait at all
      const wt=(label,to,v,msg,kind)=>{ if(!flag) return go(label,to,v,msg);
        A.push({label,fn:()=>{ if(kind==='park') note('RUNNABLE → RUNNABLE:  '+label+' with flag already true. Returns immediately, no exception; flag stays true.');
          else {flag=false; note('RUNNABLE → RUNNABLE:  '+label+' with flag already true. Throws InterruptedException immediately; flag cleared. (Tested.)');} }}); };
      wt('Thread.sleep(ms)','TIMED_WAITING','sleep','Sleeping with a deadline.');
      wt('obj.wait()','WAITING','wait','Releases the monitor and waits for notify(). (Only inside synchronized(obj) — otherwise IllegalMonitorStateException.)');
      wt('obj.wait(ms)','TIMED_WAITING','waitms','Releases the monitor; waits for notify() or the timeout. (Only inside synchronized(obj).)');
      wt('other.join()','WAITING','join','Waits until the other thread is TERMINATED.');
      wt('other.join(ms)','TIMED_WAITING','joinms','Waits for the other thread, with a deadline.');
      wt('LockSupport.park()','WAITING','park','Waits for unpark() (or an interrupt).','park');
      wt('LockSupport.parkNanos(n)','TIMED_WAITING','parkms','Waits for unpark() or the timeout.','park');
      go('enter synchronized (another thread holds the lock)','BLOCKED','sync','Waiting to get the monitor.');
      A.push({label:'interrupt()',fn:()=>{flag=true;note('RUNNABLE → RUNNABLE:  interrupt(). Only the flag is set (flag = true). A busy loop keeps running.')}});
      A.push({label:'Thread.interrupted()',fn:()=>{const was=flag;flag=false;note('RUNNABLE → RUNNABLE:  Thread.interrupted() returned '+was+' and cleared the flag.')}});
      go('run() returns or throws','TERMINATED',null,'Finished. No way back.');
      err('start()','IllegalThreadStateException — a thread can only be started once.');
    }
    else if(s==='WAITING'){
      if(via==='wait'){go('notify() / notifyAll() from another thread','BLOCKED','fromwait','Woken, but must re-take the monitor first.');
        go('interrupt()','BLOCKED','fromwait-int','Must re-take the monitor, then wait() throws InterruptedException.');}
      if(via==='join'){go('the other thread ends','RUNNABLE',null,'join() returns; its writes are now visible.');
        go('interrupt()','RUNNABLE',null,'join() throws InterruptedException; flag cleared.',()=>flag=false);}
      if(via==='park'){go('LockSupport.unpark(thread)','RUNNABLE',null,'park() returns.');
        go('interrupt()','RUNNABLE',null,'park() returns with NO exception; flag stays true.',()=>flag=true);}
    }
    else if(s==='TIMED_WAITING'){
      if(via==='sleep'){go('time runs out','RUNNABLE',null,'sleep() returns.');
        go('interrupt()','RUNNABLE',null,'sleep() throws InterruptedException; flag cleared.',()=>flag=false);}
      if(via==='waitms'){go('notify() or the timeout','BLOCKED','fromwait','Must re-take the monitor first.');
        go('interrupt()','BLOCKED','fromwait-int','Must re-take the monitor, then wait(ms) throws InterruptedException.');}
      if(via==='joinms'){go('other thread ends, or timeout','RUNNABLE',null,'join(ms) returns.');
        go('interrupt()','RUNNABLE',null,'join(ms) throws InterruptedException; flag cleared.',()=>flag=false);}
      if(via==='parkms'){go('unpark() or timeout','RUNNABLE',null,'parkNanos() returns.');
        go('interrupt()','RUNNABLE',null,'parkNanos() returns, no exception; flag stays true.',()=>flag=true);}
    }
    else if(s==='BLOCKED'){
      const extra=via==='fromwait-int'?' Then wait() throws InterruptedException; flag cleared.':(via==='fromwait'?' Then wait() returns.':'');
      go('the other thread releases the lock','RUNNABLE',null,'Monitor acquired.'+extra,via==='fromwait-int'?()=>flag=false:null);
      A.push({label:'interrupt()',fn:()=>{flag=true;note('BLOCKED → BLOCKED:  interrupt(). Still waiting for the lock; only the flag is set. (Tested.)')}});
    }
    else if(s==='TERMINATED'){err('start()','IllegalThreadStateException — TERMINATED is final.');
      A.push({label:'interrupt()',fn:()=>note('TERMINATED → TERMINATED:  interrupt() is allowed. It sets the flag (tested: isInterrupted() = true), but nothing runs to react to it.')});}
    return A;
  }
  function draw(){
    q('[data-o=boxes]').innerHTML=ST.map(x=>'<span class="sb'+(x===s?' on':'')+'">'+x+'</span>').join('');
    const why={sleep:'in sleep(ms)',waitms:'in wait(ms)',joinms:'in join(ms)',parkms:'in parkNanos()',wait:'in wait()',join:'in join()',park:'in park()',sync:'entering synchronized',fromwait:'woken from wait, re-taking the monitor','fromwait-int':'interrupted in wait, re-taking the monitor'};
    q('[data-o=now]').innerHTML='Now: <b>'+s+'</b>'+(via&&why[via]?' <span class="muted">('+why[via]+')</span>':'')+'. Interrupt flag: <b>'+flag+'</b>';
    const A=actions();
    q('[data-o=acts]').innerHTML=A.length?A.map((a,i)=>'<button data-i="'+i+'" class="'+(a.err?'bad':'')+'">'+esc(a.label)+'</button>').join(''):'';
    q('[data-o=acts]').querySelectorAll('button').forEach(b=>b.onclick=()=>{A[+b.dataset.i].fn();draw()});
    const lg=q('[data-o=log]');lg.innerHTML=log.length?log.map(l=>'<div>'+esc(l)+'</div>').join(''):'<div>new Thread(...) → NEW. Press start().</div>';lg.scrollTop=lg.scrollHeight;
  }
  function reset(){s='NEW';via=null;flag=false;log=[];draw()}
  q('[data-a=reset]').onclick=reset;
  reset();
}
const WIDGETS={amdahl:initAmdahl,race:initRace,states:initStates};

render(false);
</script>
